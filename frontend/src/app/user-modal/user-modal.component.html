<div class="modal-overlay" (click)="onClose()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ title }}</h2>
        <button class="close-button" (click)="onClose()">&times;</button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSave()">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="user.email" name="email" required>
          </div>
          <div class="form-group">
            <label for="first_name">Nombre</label>
            <input type="text" id="first_name" [(ngModel)]="user.first_name" name="first_name">
          </div>
          <div class="form-group">
            <label for="last_name">Apellido</label>
            <input type="text" id="last_name" [(ngModel)]="user.last_name" name="last_name">
          </div>
          <div class="form-group" *ngIf="!isEditing">
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" [(ngModel)]="user.is_superuser" name="is_superuser">
              <span>Es Superusuario</span>
            </label>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="onClose()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
