<div class="main-content">
  <div class="form-container">
    <h2>Añadir Nueva Conexión</h2>
    <form [formGroup]="conexionForm" class="connection-form">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" formControlName="name" placeholder="Mi Conexión" />
        </div>
        <div class="form-group">
          <label for="host">Host</label>
          <input id="host" formControlName="host" placeholder="localhost" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="db_type">Tipo de BD</label>
          <select id="db_type" formControlName="db_type">
            <option value="">Seleccionar</option>
            <option value="mysql">MySQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="sqlite">SQLite</option>
          </select>
        </div>
        <div class="form-group">
          <label for="port">Puerto</label>
          <input id="port" formControlName="port" placeholder="3306" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="dbname">Base de Datos</label>
          <input id="dbname" formControlName="dbname" placeholder="mi_base_de_datos" />
        </div>
        <div class="form-group">
          <label for="user">Usuario</label>
          <input id="user" formControlName="user" placeholder="root" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        </div>
        <div class="form-group button-group">
          <button type="button" (click)="comprobarConexion()" [disabled]="!conexionForm.valid" class="btn-primary">Comprobar</button>
          <button type="button" (click)="anadirConexion()" *ngIf="connectionSuccessful" class="btn-success">Añadir</button>
        </div>
      </div>
    </form>
  </div>
</div>
